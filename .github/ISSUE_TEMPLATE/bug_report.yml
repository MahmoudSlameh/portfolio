name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Admin panel
        - SEO / SSR
        - Installation / deployment
        - Other
    validations:
      required: true
  - type: input
    id: template
    attributes:
      label: Template
      description: Which template was active (changelog, playground, terminal…)?
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP, Node and database versions, browser, OS.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
